<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      position: relative;
        
      /* Replace with your image name */
        background-image: url('img120.jpg');
      background-size: cover;
      background-position: center;

      font-family: sans-serif;
      font-weight: bold;
    }

    /* Give every text absolute positioning */
    p {
      position: absolute;
      margin: 10px;
      color: red;
    }

    /* Corners */
    .top-left     { top: 0; left: 0; }
    .top-right    { top: 0; right: 0; }
    .bottom-left  { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; }

    /* Sides & Centers */
    .top-center    { top: 0; left: 45%; }
    .bottom-center { bottom: 0; left: 45%; }
    .mid-left      { top: 45%; left: 0; }
    .mid-right     { top: 45%; right: 0; }
    .center        { top: 45%; left: 45%; }
  </style>
</head>
<body>

  <!-- Top -->
  <p class="top-left">Ayush Kumar Singh</p>
  <p class="top-center">Ayush Kumar Singh</p>
  <p class="top-right">Ayush Kumar Singh</p>

  <!-- Middle -->
  <p class="mid-left">Ayush Kumar Singh</p>
  <p class="center">Ayush Kumar Singh</p>
  <p class="mid-right">Ayush Kumar Singh</p>

  <!-- Bottom -->
  <p class="bottom-left">Ayush Kumar Singh</p>
  <p class="bottom-center">Ayush Kumar Singh</p>
  <p class="bottom-right">Ayush Kumar Singh</p>

</body>
</html>
