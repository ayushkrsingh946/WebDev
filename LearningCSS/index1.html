<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning CSS</title>
    <style>
        /*Element Selector*/
        p.note{ 
            /* Block element */ 
            background-color: chocolate;
            color:green!important;
            border: 1px solid black;
        }
        .box 
        {
            width: 200px;
            height: 100px;
            padding: 20px;
            border: 2px solid #000;
            margin: 10px;
            box-sizing: border-box;
        }
        /*ID Selector*/
        #intro{
            color:rgb(77, 77, 242);
            border: 1px solid black;
        }
        /*Class Selector*/
        .note{
            color:red;
            border: 1px solid black;
        }
        div p{
            color:rgb(69, 165, 0);
        }
        div + p{
            color:rgb(189, 9, 132);
        }
        /* CSS Unit */
        .css-unit{
            font-size: 2rem;
            background-color: rgb(245, 64, 226);
            height: 100px;
        }
        .container
         {
            border: 5px inset red;
            width: 600px;
            margin:0 auto; /* 0 top & bottom, auto left & right */
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="box"> This is my paragraph</h1>
    <p id="intro" class="note">This is my paragraph.</p>
    <p style="color: purple;">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    <p id="intro" class="note">This is another paragraph.</p>
    <div>
        <p>Child 1</p>
        <div>
            <p><strong>Child 2</strong></p>
        </div>
        <span><p>Span P</p></span>
    </div>
    <div>
        <p class="css-unit">Just Another Paragraph</p>
    </div>
    <div class="container">
        <h1>My heading in center</h1>
    </div>
</body>
</html>
