<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning CSS</title>
    <style>
        /*Element Selector*/
        p{
            color:green;
        }
        /*ID Selector*/
        #intro{
            color:rgb(77, 77, 242);
        }
        /*Class Selector*/
        .note{
            color:red;
        }
    </style>
</head>
<body>
    <h1> This is my paragraph</h1>
    <p id="intro" class="note">This is my paragraph.</p>
    <p style="color: purple;">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    <p id="intro">This is another paragraph.</p>
</body>
</html>
